<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #ff0000;
            --primary-dim: #ff4444;
            --admin: #ffd700;
            --bg: #000000;
            --surface: rgba(0, 0, 0, 0.75);
            --border: rgba(255, 0, 0, 0.25);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        
        html, body { 
            background-color: var(--bg); 
            color: var(--primary-dim); 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw; 
        }
        
        /* ========== LOGIN SCREEN ========== */
        #login-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background-image: url('https://i.pinimg.com/736x/97/d1/98/97d198f2de3a40b28e8f9bb58c4ad1ca.jpg'); 
            background-size: 500px; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 20px;
        }
        
        #login-content { 
            background-color: rgba(0, 0, 0, 0.6); 
            padding: 40px 30px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 0, 0, 0.5); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            max-width: 400px; 
            backdrop-filter: blur(25px); 
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.15); 
            gap: 15px;
        }

        .login-title {
            font-size: 42px; 
            color: var(--primary); 
            text-shadow: 0 0 30px var(--primary); 
            margin-bottom: 15px; 
            font-weight: bold;
            letter-spacing: 5px;
        }
        
        #login-screen input { 
            width: 100%; 
            text-align: center; 
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid var(--primary); 
            color: var(--primary); 
            padding: 16px; 
            border-radius: 10px; 
            outline: none; 
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }

        #login-screen input:focus {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            border-color: #ff3333;
        }

        #login-screen input::placeholder {
            color: rgba(255, 68, 68, 0.4);
        }

        .login-btn {
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 3px;
            transition: all 0.2s;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #ff3333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        /* ========== MAIN CHAT LAYOUT ========== */
        #chat-box {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #terminal { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            background-image: url('https://i.pinimg.com/736x/97/d1/98/97d198f2de3a40b28e8f9bb58c4ad1ca.jpg');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            padding: 15px; 
            position: relative;
            gap: 10px;
        }

        /* ========== HEADER ========== */
        #header-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 12px 20px; 
            background: var(--surface); 
            backdrop-filter: blur(15px); 
            border: 1px solid var(--border); 
            border-radius: 14px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .header-main { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            gap: 15px;
        }
        
        .header-logo { 
            width: 50px; 
            height: 50px; 
            object-fit: contain; 
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        .header-logo:hover {
            transform: scale(1.1) rotate(5deg);
        }
        
        #header { 
            font-size: 36px; 
            font-weight: bold; 
            color: var(--primary); 
            text-shadow: 0 0 20px var(--primary); 
            flex-grow: 1; 
            text-align: center; 
            letter-spacing: 4px; 
        }
        
        #creator-tag { 
            font-size: 11px; 
            color: var(--primary); 
            letter-spacing: 3px; 
            margin-top: 4px; 
            opacity: 0.6; 
            font-weight: normal; 
        }

        /* ========== MAIN CONTENT AREA ========== */
        #main-content {
            flex-grow: 1;
            display: flex;
            gap: 12px;
            overflow: hidden;
            min-height: 0;
        }

        /* ========== MESSAGES AREA ========== */
        #messages-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        #messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(12px); 
            padding: 20px; 
            border: 1px solid var(--border); 
            border-radius: 14px;
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
            gap: 2px;
        }

        #messages::-webkit-scrollbar { 
            width: 6px; 
        }
        
        #messages::-webkit-scrollbar-thumb { 
            background-color: var(--primary); 
            border-radius: 10px; 
        }
        
        #msg-container {
            display: flex; 
            flex-direction: column;
            width: 100%;
        }

        /* ========== MESSAGE BUBBLES ========== */
        .msg { 
            margin-bottom: 14px; 
            padding: 14px 18px; 
            font-size: 15px; 
            word-wrap: break-word; 
            border-radius: 0 14px 14px 0; 
            border-left: 4px solid; 
            background: rgba(0, 0, 0, 0.65); 
            position: relative;
            animation: slideIn 0.35s ease-out;
            max-width: 85%;
            transition: all 0.2s;
        }

        .msg:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: translateX(4px);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .msg-user {
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .msg-time {
            font-size: 11px;
            opacity: 0.5;
            color: #888;
        }

        .msg-body {
            line-height: 1.6;
            word-break: break-word;
            color: #ffcccc;
        }

        .reply-btn { 
            font-size: 12px; 
            cursor: pointer; 
            color: #888; 
            margin-top: 8px; 
            display: inline-flex; 
            align-items: center;
            gap: 5px;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 6px;
            transition: all 0.2s;
            user-select: none;
            border: 1px solid transparent;
        }

        .reply-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 0, 0, 0.3);
            color: var(--primary);
        }

        .quote-box { 
            background: rgba(255, 255, 255, 0.08); 
            border-left: 3px solid #555; 
            padding: 8px 12px; 
            margin-bottom: 8px; 
            font-size: 13px; 
            opacity: 0.85; 
            font-style: italic; 
            border-radius: 6px;
            color: #ccc;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            z-index: 5;
        }

        .msg:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.5);
            transform: scale(1.1);
        }

        /* ========== SIDEBAR (ONLINE USERS) ========== */
        #sidebar {
            width: 220px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #sidebar h4 { 
            margin: 0; 
            font-size: 13px; 
            text-transform: uppercase; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 10px; 
            color: var(--primary);
            letter-spacing: 2px;
            text-align: center;
        }

        #members-list {
            overflow-y: auto;
            flex-grow: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        #members-list::-webkit-scrollbar {
            width: 4px;
        }

        #members-list::-webkit-scrollbar-thumb {
            background-color: var(--primary);
            border-radius: 10px;
        }
        
        .member-item { 
            font-size: 13px; 
            margin-bottom: 10px; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding: 6px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .member-item:hover {
            background: rgba(255, 0, 0, 0.1);
        }
        
        .online-dot { 
            width: 8px; 
            height: 8px; 
            background: #0f0; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #0f0; 
            flex-shrink: 0;
        }

        .member-count {
            text-align: center;
            font-size: 11px;
            color: #888;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        /* Mobile toggle button (hidden on desktop) */
        #online-panel {
            display: none;
        }

        /* ========== INPUT AREA ========== */
        .input-container { 
            padding: 6px; 
            flex-shrink: 0;
        }
        
        #reply-preview { 
            display: none; 
            background: rgba(255, 0, 0, 0.15); 
            padding: 10px 18px; 
            font-size: 13px; 
            border: 1px solid var(--primary); 
            border-bottom: none; 
            border-radius: 14px 14px 0 0; 
            width: calc(100% - 12px); 
            margin: 0 auto; 
            justify-content: space-between; 
            align-items: center; 
            backdrop-filter: blur(10px);
        }
        
        .cancel-reply { 
            cursor: pointer; 
            color: #fff; 
            font-weight: bold; 
            font-size: 20px; 
            margin-left: 12px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .cancel-reply:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .controls { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            width: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            border: 1px solid var(--primary); 
            border-radius: 25px; 
            padding: 8px 16px; 
            min-height: 56px;
        }
        
        input[type="text"] { 
            background: transparent; 
            border: none; 
            color: var(--primary); 
            padding: 0 6px; 
            font-size: 16px; 
            outline: none; 
            flex-grow: 1; 
            font-family: inherit; 
            min-height: 24px;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 68, 68, 0.4);
        }
        
        button#sendBtn { 
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 12px 24px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 14px; 
            min-height: 44px;
            font-size: 15px;
            transition: all 0.2s;
            flex-shrink: 0;
            letter-spacing: 1px;
        }

        button#sendBtn:hover {
            background: #ff3333;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        button#sendBtn:active {
            transform: scale(0.95);
        }
        
        .upload-btn { 
            background: transparent; 
            color: var(--primary); 
            border: 1px solid var(--primary); 
            width: 44px; 
            height: 44px; 
            font-size: 24px; 
            cursor: pointer; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background: rgba(255, 0, 0, 0.2);
        }

        .upload-btn:active {
            transform: scale(0.95);
        }

        .hidden { 
            display: none !important; 
        }
        
        .chat-img { 
            max-width: 350px; 
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px; 
            margin-top: 10px; 
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-img:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }

        #preview-container { 
            display: none; 
            padding: 8px; 
            font-size: 13px; 
            color: var(--admin); 
            text-align: center; 
            font-weight: bold;
        }

        /* ========== MOBILE RESPONSIVE ========== */
        @media (max-width: 768px) {
            #terminal {
                padding: 8px;
                gap: 8px;
            }

            #header-container {
                padding: 8px 12px;
                border-radius: 12px;
            }

            .header-logo {
                width: 36px;
                height: 36px;
            }

            #header {
                font-size: 22px;
                letter-spacing: 2px;
            }

            #creator-tag {
                font-size: 9px;
            }

            /* Hide sidebar on mobile, show floating panel */
            #sidebar {
                display: none;
            }

            #online-panel {
                display: flex;
                position: absolute; 
                top: 75px; 
                right: 8px; 
                z-index: 100;
                align-items: flex-start; 
                gap: 5px;
            }

            #members-list-container {
                width: 170px; 
                max-height: 220px; 
                overflow-y: auto;
                background: rgba(0, 0, 0, 0.9); 
                backdrop-filter: blur(20px);
                border: 1px solid var(--border); 
                border-radius: 12px;
                padding: 12px; 
                display: none;
                box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            }

            #members-list-container h4 { 
                margin: 0 0 10px 0; 
                font-size: 12px; 
                text-transform: uppercase; 
                border-bottom: 1px solid var(--border); 
                padding-bottom: 6px; 
                color: var(--primary);
            }
            
            #toggle-members {
                background: rgba(255, 0, 0, 0.2); 
                border: 1px solid var(--primary); 
                color: var(--primary);
                cursor: pointer; 
                padding: 6px 8px; 
                border-radius: 8px; 
                font-weight: bold; 
                font-size: 14px;
                backdrop-filter: blur(10px);
                transition: all 0.2s;
                min-width: 32px;
                min-height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #messages {
                padding: 12px;
                border-radius: 12px;
            }

            .msg {
                padding: 10px 12px;
                font-size: 15px;
                max-width: 95%;
                border-radius: 0 10px 10px 0;
            }

            .msg:hover {
                transform: none;
            }

            .chat-img {
                max-width: 100%;
                max-height: 250px;
            }

            .delete-btn {
                opacity: 1;
                width: 24px;
                height: 24px;
                font-size: 11px;
            }

            .controls {
                min-height: 50px;
                padding: 6px 12px;
                border-radius: 20px;
            }

            input[type="text"] {
                font-size: 16px;
            }

            .upload-btn {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }

            button#sendBtn {
                padding: 10px 16px;
                min-height: 38px;
                font-size: 14px;
            }

            .login-title {
                font-size: 32px;
            }

            #login-content {
                padding: 30px 20px;
                max-width: 340px;
            }
        }

        @media (max-width: 480px) {
            #header {
                font-size: 18px;
            }

            .header-logo {
                width: 30px;
                height: 30px;
            }

            .msg {
                max-width: 100%;
                padding: 8px 10px;
            }

            .msg-user {
                font-size: 12px;
            }

            .msg-time {
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            #header {
                font-size: 16px;
                letter-spacing: 1px;
            }

            .header-logo {
                width: 26px;
                height: 26px;
            }
        }

        /* Landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            #header-container {
                padding: 6px 12px;
            }

            #creator-tag {
                display: none;
            }

            .header-logo {
                width: 32px;
                height: 32px;
            }
        }

        /* Large screens */
        @media (min-width: 1400px) {
            #terminal {
                padding: 20px 40px;
                max-width: 1600px;
                margin: 0 auto;
            }

            .msg {
                max-width: 70%;
            }

            #sidebar {
                width: 260px;
            }
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background-color: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div id="login-content">
        <div class="login-title">𝐕𝐈𝐆𝐈𝐋𝐀𝐍𝐓𝐄</div>
        <input type="text" id="username" placeholder="Codename..." autocomplete="off" autocapitalize="off">
        <div id="admin-pass-container" class="hidden" style="width: 100%;">
            <input type="password" id="adminPass" placeholder="Admin Access Key..." style="border-color: #ffd700; color: #ffd700;">
        </div>
        <button class="login-btn" onclick="handleLogin()">AUTHENTICATE</button>
    </div>
</div>

<div id="chat-box" class="hidden">
    <div id="terminal">
        <div id="header-container">
            <div class="header-main">
                <img src="https://i.pinimg.com/736x/97/d1/98/97d198f2de3a40b28e8f9bb58c4ad1ca.jpg" class="header-logo" alt="logo">
                <div id="header">𝐕𝐈𝐆𝐈𝐋𝐀𝐍𝐓𝐄</div>
                <img src="https://i.pinimg.com/736x/97/d1/98/97d198f2de3a40b28e8f9bb58c4ad1ca.jpg" class="header-logo" alt="logo">
            </div>
            <div id="creator-tag">𝖈𝖗𝖊𝖆𝖙𝖊𝖉 𝖇𝖞 𝖒𝖗 𝖛𝖊𝖓𝖔𝖒</div>
        </div>

        <!-- Mobile Online Panel -->
        <div id="online-panel">
            <div id="members-list-container">
                <h4>Active Agents</h4>
                <div id="members-list-mobile"></div>
            </div>
            <button id="toggle-members" onclick="toggleMembers()">◀</button>
        </div>

        <div id="main-content">
            <!-- Messages Area -->
            <div id="messages-wrapper">
                <div id="messages">
                    <div id="msg-container"></div> 
                </div>
                
                <div class="input-container">
                    <div id="reply-preview">
                        <span id="reply-text" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                        <span class="cancel-reply" onclick="cancelReply()">✕</span>
                    </div>
                    <div id="preview-container">📎 DATA READY TO TRANSMIT</div>
                    <div class="controls">
                        <input type="file" id="imageInput" class="hidden" accept="image/*" onchange="showPreview()">
                        <button class="upload-btn" onclick="document.getElementById('imageInput').click()">+</button>
                        <input type="text" id="userInput" placeholder="Type message..." autocomplete="off" autocapitalize="off">
                        <button id="sendBtn" onclick="sendMessage()">SEND</button>
                    </div>
                </div>
            </div>

            <!-- Desktop Sidebar -->
            <div id="sidebar">
                <h4>🔴 Active Agents</h4>
                <div id="members-list-desktop"></div>
                <div class="member-count" id="member-count">0 agents online</div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://ydzqkunyqbhjkcippqgx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkenFrdW55cWJoamtjaXBwcWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MjY1NzgsImV4cCI6MjA5MDIwMjU3OH0.soSmFcFnkq4LZZuDDZe5vVaOLzUghz9QYRHQSh3fVS0";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = "";
    let selectedImageBase64 = null;
    let replyData = null;
    let messageChannel = null;
    let presenceChannel = null;

    function isAdminUser(user) {
        return user === "𝖒𝖗 𝖛𝖊𝖓𝖔𝖒" || user.toUpperCase() === "ADMIN_BIG MOUSE" || user.toUpperCase() === "ADMIN VENOM";
    }

    function getDisplayName(user) {
        return isAdminUser(user) ? "𝖒𝖗 𝖛𝖊𝖓𝖔𝖒" : user;
    }

    function getUserColor(user) {
        return isAdminUser(user) ? "#ffd700" : "#ff4444";
    }

    document.getElementById('username').addEventListener('input', (e) => {
        document.getElementById('admin-pass-container').classList.toggle('hidden', !e.target.value.toUpperCase().startsWith("ADMIN_"));
    });

    async function handleLogin() {
        const name = document.getElementById('username').value.trim();
        const pass = document.getElementById('adminPass').value;
        if (!name) return;

        const upperName = name.toUpperCase();

        if (upperName === "ADMIN_BIG MOUSE") {
            if (pass === "induwara2010") {
                currentUser = "𝖒𝖗 𝖛𝖊𝖓𝖔𝖒"; 
            } else {
                alert("ACCESS DENIED");
                return;
            }
        } else {
            currentUser = name;
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('chat-box').classList.remove('hidden');
        initChat();
    }

    function toggleMembers() {
        const list = document.getElementById('members-list-container');
        const btn = document.getElementById('toggle-members');
        if (list.style.display === "none" || list.style.display === "") {
            list.style.display = "block";
            btn.innerText = "▶";
        } else {
            list.style.display = "none";
            btn.innerText = "◀";
        }
    }

    async function initChat() {
        await fetchMessages();
        
        presenceChannel = _supabase.channel('online-users', { 
            config: { presence: { key: currentUser } } 
        });
        
        presenceChannel.on('presence', { event: 'sync' }, () => { 
            updateMembersList(presenceChannel.presenceState()); 
        }).subscribe(async (status) => { 
            if (status === 'SUBSCRIBED') {
                await presenceChannel.track({ 
                    online_at: new Date().toISOString(),
                    user: currentUser 
                }); 
            }
        });

        messageChannel = _supabase.channel('messages_channel');
        messageChannel.on('postgres_changes', { 
            event: '*', 
            schema: 'public', 
            table: 'messages' 
        }, payload => {
            if (payload.eventType === 'INSERT') {
                appendMessage(
                    payload.new.id, 
                    payload.new.username, 
                    payload.new.msg, 
                    payload.new.image_data,
                    payload.new.created_at
                );
                scrollToBottom();
            }
            if (payload.eventType === 'DELETE') {
                const el = document.getElementById(`msg-${payload.old.id}`);
                if (el) {
                    el.style.opacity = '0';
                    el.style.transform = 'translateX(20px)';
                    setTimeout(() => el.remove(), 300);
                }
            }
        }).subscribe();
    }

    function updateMembersList(presenceState) {
        const mobileList = document.getElementById('members-list-mobile');
        const desktopList = document.getElementById('members-list-desktop');
        const countEl = document.getElementById('member-count');
        
        mobileList.innerHTML = "";
        desktopList.innerHTML = "";
        
        let users = Object.keys(presenceState);
        
        users.sort((a, b) => {
            let isAdminA = isAdminUser(a);
            let isAdminB = isAdminUser(b);
            if (isAdminA && !isAdminB) return -1;
            if (!isAdminA && isAdminB) return 1;
            return a.localeCompare(b);
        });

        users.forEach(user => {
            const admin = isAdminUser(user);
            const displayUser = getDisplayName(user);
            const dotColor = admin ? "#ffd700" : "#0f0";
            const nameColor = admin ? "#ffd700" : "#fff";
            
            const html = `
                <span class="online-dot" style="background:${dotColor}; box-shadow: 0 0 6px ${dotColor};"></span> 
                <span style="color:${nameColor}">${displayUser}</span>
            `;
            
            const mobileDiv = document.createElement('div');
            mobileDiv.className = "member-item";
            mobileDiv.innerHTML = html;
            mobileList.appendChild(mobileDiv);
            
            const desktopDiv = document.createElement('div');
            desktopDiv.className = "member-item";
            desktopDiv.innerHTML = html;
            desktopList.appendChild(desktopDiv);
        });

        countEl.innerText = `${users.length} agent${users.length !== 1 ? 's' : ''} online`;
    }

    function scrollToBottom() {
        const msgDiv = document.getElementById('messages');
        msgDiv.scrollTop = msgDiv.scrollHeight;
    }

    async function fetchMessages() {
        const { data, error } = await _supabase
            .from('messages')
            .select('*')
            .order('id', { ascending: true });
            
        if (error) {
            console.error('Error fetching messages:', error);
            return;
        }
        
        document.getElementById('msg-container').innerHTML = '';
        if (data) {
            data.forEach(m => appendMessage(m.id, m.username, m.msg, m.image_data, m.created_at));
            scrollToBottom();
        }
    }

    function showPreview() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return;
        
        if (file.size > 2 * 1024 * 1024) {
            alert("Image too large. Max 2MB.");
            document.getElementById('imageInput').value = '';
            return;
        }
        
        const reader = new FileReader();
        reader.onloadend = () => { 
            selectedImageBase64 = reader.result; 
            document.getElementById('preview-container').style.display = 'block'; 
        };
        reader.readAsDataURL(file);
    }

    function setReply(user, msg) {
        const displayUser = getDisplayName(user);
        const shortMsg = msg.length > 35 ? msg.substring(0, 35) + "..." : msg;
        replyData = { user: displayUser, msg: shortMsg };
        document.getElementById('reply-text').innerText = `Replying to @${displayUser}: ${shortMsg}`;
        document.getElementById('reply-preview').style.display = 'flex';
        document.getElementById('userInput').focus();
    }

    function cancelReply() { 
        replyData = null; 
        document.getElementById('reply-preview').style.display = 'none'; 
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        let text = input.value.trim();
        if (!text && !selectedImageBase64) return;
        
        let finalMsg = text;
        if (replyData) {
            finalMsg = `>>REPLY[${replyData.user}:${replyData.msg}]<< ${text}`;
        }
        
        const imgToSend = selectedImageBase64;
        
        input.value = ""; 
        selectedImageBase64 = null;
        cancelReply();
        document.getElementById('preview-container').style.display = 'none';
        document.getElementById('imageInput').value = '';
        
        const { error } = await _supabase.from('messages').insert([{ 
            username: currentUser, 
            msg: finalMsg, 
            image_data: imgToSend 
        }]);
        
        if (error) {
            console.error('Send error:', error);
            alert("Failed to send message. Please try again.");
        }
    }

    function formatTime(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(id, user, rawMsg, imgData, createdAt) {
        if (document.getElementById(`msg-${id}`)) return;
        
        const msgContainer = document.getElementById('msg-container');
        const div = document.createElement('div');
        div.id = `msg-${id}`;
        div.className = "msg";
        
        const displayUser = getDisplayName(user);
        const displayColor = getUserColor(user);
        const canDelete = (currentUser === "𝖒𝖗 𝖛𝖊𝖓𝖔𝖒" || user === currentUser);
        
        div.style.borderColor = displayColor;
        
        let cleanMsg = rawMsg;
        let replyHtml = "";
        
        if (rawMsg && rawMsg.startsWith(">>REPLY[")) {
            const endIdx = rawMsg.indexOf("]<<");
            if (endIdx > -1) {
                const parts = rawMsg.substring(8, endIdx).split(":");
                const replyUser = parts[0];
                const replyMsg = parts.slice(1).join(":");
                replyHtml = `<div class="quote-box" style="border-color: ${displayColor};">@${replyUser}: ${replyMsg}</div>`;
                cleanMsg = rawMsg.substring(endIdx + 4).trim();
            }
        }
        
        const escapeHtml = (text) => {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        };
        
        const safeMsg = cleanMsg ? escapeHtml(cleanMsg) : '';
        const safeUser = escapeHtml(displayUser);
        
        div.innerHTML = `
            ${canDelete ? `<div class="delete-btn" onclick="event.stopPropagation(); handleDelete(${id}, '${escapeHtml(user)}')">🗑</div>` : ''}
            <div class="msg-header">
                <span class="msg-user" style="color:${displayColor}">[${safeUser}]</span>
                <span class="msg-time">${formatTime(createdAt)}</span>
            </div>
            <div class="msg-body" style="color: ${displayColor === '#ffd700' ? '#ffe066' : '#ffcccc'}">${safeMsg}</div>
            ${imgData ? `<img src="${imgData}" class="chat-img" alt="shared image" onclick="window.open(this.src, '_blank')">` : ''}
            <div class="reply-btn" onclick="event.stopPropagation(); setReply('${safeUser}', '${safeMsg.replace(/'/g, "\\'")}')">
                ↩ REPLY
            </div>
        `;
        
        msgContainer.appendChild(div);
    }

    async function handleDelete(id, user) {
        if (currentUser === "𝖒𝖗 𝖛𝖊𝖓𝖔𝖒" || user === currentUser) { 
            if(confirm("Destroy this intel?")) {
                const { error } = await _supabase.from('messages').delete().eq('id', id);
                if (error) {
                    console.error('Delete error:', error);
                    alert("Failed to delete message.");
                }
            }
        }
    }
    
    document.getElementById("userInput").addEventListener("keypress", (e) => { 
        if (e.key === "Enter") sendMessage(); 
    });

    window.addEventListener('resize', () => {
        scrollToBottom();
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && presenceChannel) {
            presenceChannel.track({ 
                online_at: new Date().toISOString(),
                user: currentUser 
            });
        }
    });
</script>
</body>
</html>
